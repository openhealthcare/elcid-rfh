{% extends 'research/_study_detail_base.html' %}
{% block study_body %}
<div class="panel-body">
  <h2>
    Participant ID {{ participant.get_participant_number }}
  </h2>
  <section class="container">

      <div class="row" >
        <div class="col-md-8">
          <h2>
            <a href="/#/research/study/[[study.id]]/" class="orange-link">
              {{ study.name }}
            </a>
          </h2>
        </div>
        <div class="col-md-4">
          <h3>
            <a class="btn btn-secondary btn-sm"
               ng-click="open_modal('NewResearchNoteCtrl', '/templates/research/modals/new_research_note.html', {study_id: {{study.id}}, episode_id: {{episode.id}} })"
               >
              Add Note
            </a>
          </h3>
        </div>
      </div>

      <div class="row">
        <div class="col-md-12">
          {% for note in notes %}
          <div>
            <span class="patient-timeline-date">{{ note.when }}</span>

            <span class="pull-right">
              <i class="fa fa-pencil edit pull-right pointer"
                 ng-click="open_modal('EditResearchNoteCtrl', '/templates/research/modals/new_research_note.html', {note_text: '{{note.note}}', note_id: {{note.id}} })"></i>
            </span>
          </div>
          <div class="whitespacey">{{ note.note }}</div>
          <hr />
          {% endfor %}
        </div>
      </div>


  </section>

</div>


{% endblock %}
