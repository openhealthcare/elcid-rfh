<div class="content-offset right-viewport">

    <div class="panel-heading">

        <div class="col-md-4">
          <h1>OPAT Patients {{ year }}</h1>
        </div>
      </div>
    </div> <!-- heading -->

    <div class="panel-body">
      {% for row in rows %}
      <div class="row">
        <div class="col-md-4">
          <a href="/#/patient/{{row.demographics.patient_id}}/{{row.episode.id}}" class="orange-link">
            {{ row.demographics.hospital_number }} {{ row.demographics.name }} {{ row.demographics.date_of_birth }}
          </a>
        </div>
        <div class="col-md-4">{{ row.opat.accepted_date}}</div>
        <div class="col-md-4"></div>
      </div>
      {% endfor %}

    </div> <!-- panel body -->
