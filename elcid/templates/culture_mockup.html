<div class="left-menu">
  <h3>
    <a href="/#/beta/cultures/">+ve Cultures</a>
  </h3>
  <ul>
  </ul>
</div>

<div class="content-offset right-viewport">
  <div class="panel panel-default">
    <div class="panel-heading">
      <h1>+ve Cultures: Royal Free Hospital</h1>
    </div> <!-- Heading -->



    <section class="study-nav">
      <div class="row">
        <div class="col-md-2 active">
          <a class="orange-link bl" href="/#/beta/cultures/">RFH</a>
        </div>
        <div class="col-md-2 active">
          <a class="orange-link bl" href="/#/beta/cultures/">Barnet</a>
        </div>
        <div class="col-md-2 active">
          <a class="orange-link bl" href="/#/beta/cultures/">Chase Farm</a>
        </div>

      </div>
    </section>


    <div class="panel-body">

      <h2>
        {{ tests|length }} Cultures
      </h2>


      <div class="row">
        <table class="table table-striped"
          <tr>
            <th>Lab #</th>
            <th>Date</th>
            <th>Test</th>
            <th>Patient</th>
            <th>Isolates</th>
          </tr>
          {% for test in tests %}
          <tr>
            <td>
              <a href="/#/lab-test/{{test.lab_number}}" class="orange-link">
                {{ test.lab_number }}
              </a>
            </td>
            <td>
              {{ test.datetime_ordered }}
            </td>
            <td>
              {{ test.test_name }}
            </td>
            <td>
              <a href="{{ patient.get_absolute_url }}" class="orange-link">
                {{ patient.get_demographics.name }}
              </a>
            </td>
            <td>
              Observation
            </td>
          </tr>
          {% endfor %}
        </table>
      </div>


    </div> <!-- Panel Body -->
  </div>  <!-- Panel -->
</div>   <!-- Col 11 -->
